trigger:\n  branches:\n    include:\n    - master\nvariables:\n- template: variables.yml\nstages:\n- stage: Restore\n  jobs:\n  - job: Restore\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: NodeTool@0\n      inputs:\n        versionSpec: '16.x'\n      displayName: 'Install Node.js'\n    - script: npm ci\n      displayName: 'Install npm deps'\n- stage: Build\n  jobs:\n  - job: Build\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - script: npm run build\n      displayName: 'Build frontend'\n- stage: Test\n  jobs:\n  - job: Test\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - template: templates/test-frontend.yml\n- stage: Docker\n  jobs:\n  - job: Docker\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - template: templates/docker-build.yml\n      parameters:\n        dockerfile: frontend/Dockerfile\n        imageName: $(ACR_NAME)/frontend\n        tag: $(Build.BuildId)\n