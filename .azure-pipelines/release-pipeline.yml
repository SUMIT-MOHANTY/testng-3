trigger: none\nresources:\n  pipelines:\n  - pipeline: backendCI\n    source: backend-ci\n    trigger: true\n  - pipeline: frontendCI\n    source: frontend-ci\n    trigger: true\nvariables:\n- template: variables.yml\n- name: backendTag\n  value: $[ dependencies.backendCI.outputs['Build.BuildId'] ]\n- name: frontendTag\n  value: $[ dependencies.frontendCI.outputs['Build.BuildId'] ]\nstages:\n- stage: DeployTest\n  jobs:\n  - job: Deploy\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: DockerCompose@0\n      inputs:\n        action: 'Run services'\n        dockerComposeFile: 'docker-compose.yml'\n        projectName: 'test'\n        detached: true\n        envFile: '.env.example'\n- stage: Approval\n  dependsOn: DeployTest\n  condition: succeeded()\n  jobs:\n  - job: WaitApproval\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: ManualValidation@0\n      inputs:\n        notifyUsers: ''\n        instructions: 'Approve deployment to production.'\n- stage: DeployProd\n  dependsOn: Approval\n  condition: succeeded()\n  jobs:\n  - job: Deploy\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: DockerCompose@0\n      inputs:\n        action: 'Run services'\n        dockerComposeFile: 'docker-compose.yml'\n        projectName: 'prod'\n        detached: true\n        envFile: '.env.example'\n