trigger:\n  branches:\n    include:\n    - master\nvariables:\n- template: variables.yml\nstages:\n- stage: Restore\n  jobs:\n  - job: Restore\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: UsePythonVersion@0\n      inputs:\n        versionSpec: '3.11'\n    - script: pip install -r requirements.txt\n      displayName: 'Install dependencies'\n- stage: Build\n  jobs:\n  - job: Build\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: Python@3\n      inputs:\n        command: 'custom'\n        customCommand: 'python -m build'\n        workingDirectory: 'backend'\n- stage: Test\n  jobs:\n  - job: Test\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - template: templates/test-backend.yml\n- stage: Package\n  jobs:\n  - job: Package\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - task: ArchiveFiles@2\n      inputs:\n        rootFolderOrFile: 'backend'\n        includeRootFolder: false\n        archiveType: 'zip'\n        archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'\n        replaceExistingArchive: true\n- stage: Docker\n  jobs:\n  - job: Docker\n    pool:\n      vmImage: 'ubuntu-latest'\n    steps:\n    - template: templates/docker-build.yml\n      parameters:\n        dockerfile: backend/Dockerfile\n        imageName: $(ACR_NAME)/backend\n        tag: $(Build.BuildId)\n