version: '3.8'\nservices:\n  backend:\n    image: ${ACR_NAME}/backend:${BACKEND_TAG}\n    ports:\n      - "8000:8000"\n  frontend:\n    image: ${ACR_NAME}/frontend:${FRONTEND_TAG}\n    ports:\n      - "3000:80"\n
version: "3.9"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - SECRET_KEY=your-secret-key
    ports:
      - "8000:8000"
