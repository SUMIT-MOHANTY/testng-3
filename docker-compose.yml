version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:80"
    depends_on:
      - db

  frontend:
    build: ./frontend
    env_file: ./frontend/.env.example
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
